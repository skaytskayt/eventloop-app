<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пушкинская карта — подборка</title>
<meta name="description" content="Подборка мероприятий по Пушкинской карте: смотри, отмечай, покупай билет.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.6 10.4 12 3.8l8.4 6.6V20a1 1 0 0 1-1 1h-4.6v-6H9.2v6H4.6a1 1 0 0 1-1-1z"/>
  </symbol>
  <symbol id="icon-home-fill" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 3.3 21 10.3V20a1.4 1.4 0 0 1-1.4 1.4h-4.4a.8.8 0 0 1-.8-.8v-4.5H9.6v4.5a.8.8 0 0 1-.8.8H4.4A1.4 1.4 0 0 1 3 20v-9.7z"/>
  </symbol>
  <symbol id="icon-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20.3s-7.6-4.6-7.6-9.6A4.3 4.3 0 0 1 12 8.2a4.3 4.3 0 0 1 7.6 2.5c0 5-7.6 9.6-7.6 9.6Z"/>
  </symbol>
  <symbol id="icon-heart-fill" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 20.7C11.3 20.3 3.7 15.6 3.7 10.6A4.9 4.9 0 0 1 12 7.3a4.9 4.9 0 0 1 8.3 3.3c0 5-7.6 9.7-8.3 10.1Z"/>
  </symbol>
  <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8.3" r="3.6"/><path d="M4.9 20.2c.6-3.6 3.6-5.6 7.1-5.6s6.5 2 7.1 5.6"/>
  </symbol>
  <symbol id="icon-user-fill" viewBox="0 0 24 24" fill="currentColor">
    <circle cx="12" cy="8" r="4.1"/><path d="M12 13.8c4 0 7.1 2.4 7.6 6.4a.7.7 0 0 1-.7.8H5.1a.7.7 0 0 1-.7-.8c.5-4 3.6-6.4 7.6-6.4Z"/>
  </symbol>
  <symbol id="icon-bookmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.6 4.4h10.8v16l-5.4-4.1-5.4 4.1z"/>
  </symbol>
  <symbol id="icon-bookmark-fill" viewBox="0 0 24 24" fill="currentColor">
    <path d="M6.2 4.9a1.4 1.4 0 0 1 1.4-1.4h8.8a1.4 1.4 0 0 1 1.4 1.4v15.2a.8.8 0 0 1-1.3.6L12 16.9l-4.5 3.8a.8.8 0 0 1-1.3-.6z"/>
  </symbol>
  <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.6" y="5.4" width="16.8" height="15" rx="3"/><path d="M8.2 3.2v4M15.8 3.2v4M3.6 10.2h16.8"/>
  </symbol>
  <symbol id="icon-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21.2c4.2-4.4 6.3-7.7 6.3-10.2a6.3 6.3 0 1 0-12.6 0c0 2.5 2.1 5.8 6.3 10.2Z"/><circle cx="12" cy="10.6" r="2.4"/>
  </symbol>
  <symbol id="icon-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.4 6.6 9 4.3l6 2.3 5.6-2.3v13.4L15 20l-6-2.3-5.6 2.3z"/><path d="M9 4.3v13.4M15 6.6V20"/>
  </symbol>
  <symbol id="icon-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.5 5.5 8 12l6.5 6.5"/>
  </symbol>
  <symbol id="icon-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.6v11M12 3.6 8.4 7.2M12 3.6l3.6 3.6M5.6 12.4v6.4a1.6 1.6 0 0 0 1.6 1.6h9.6a1.6 1.6 0 0 0 1.6-1.6v-6.4"/>
  </symbol>
  <symbol id="icon-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="m12 3.4 2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.7l6-.8z"/>
  </symbol>
  <symbol id="icon-star-fill" viewBox="0 0 24 24" fill="currentColor">
    <path d="m12 3.4 2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.7l6-.8z"/>
  </symbol>
  <symbol id="icon-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20h4l10-10a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 6.5 17.5 9.5"/>
  </symbol>
  <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M7 7l10 10M17 7 7 17"/>
  </symbol>
  <symbol id="icon-ticket" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.4 8.4V6.2a1.4 1.4 0 0 1 1.4-1.4h14.4a1.4 1.4 0 0 1 1.4 1.4v2.2a2.6 2.6 0 0 0 0 5.2v2.2a1.4 1.4 0 0 1-1.4 1.4H4.8a1.4 1.4 0 0 1-1.4-1.4v-2.2a2.6 2.6 0 0 0 0-5.2Z"/>
  </symbol>
</svg>

<div class="app">

  <header class="topbar">
    <img class="topbar__logo" src="assets/max-x-pushkin.png" alt="MAX × Пушкинская карта">
  </header>

  <section id="screen-welcome" class="screen screen--light is-active">
    <div class="welcome" id="welcome">
      <img class="welcome__art" src="assets/pushkin-main.png" alt="">
      <h1 class="welcome__title">Карта событий<br>уже ждёт тебя</h1>
      <p class="welcome__sub">Открывай театры, выставки<br>и другие культурные события<br>рядом с тобой.</p>
      <button class="welcome__hint" id="welcome-start" type="button" aria-label="Начать">
        <svg class="welcome__hand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 11v-1a2 2 0 0 0-4 0"/><path d="M14 10V9a2 2 0 0 0-4 0v1"/><path d="M10 9.5V4a2 2 0 0 0-4 0v10"/>
          <path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
        </svg>
        <svg class="welcome__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12H4M9 7l-5 5 5 5"/>
        </svg>
      </button>
      <p class="welcome__cta">Свайпни, чтобы начать</p>
    </div>
  </section>

  <section id="screen-feed" class="screen screen--light">
    <div class="screen__scroll">
      <div class="filters" id="feed-filters"></div>
      <div class="deck-head">
        <button class="back-card" id="feed-back" type="button" hidden aria-label="Вернуть предыдущую карточку">
          <svg class="ic ic--16"><use href="#icon-back"></use></svg>
        </button>
        <span class="swipe__counter" id="feed-counter"></span>
        <span class="swipe__track"><i id="feed-bar"></i></span>
      </div>
      <div id="feed-card" class="feed-card-slot"></div>
    </div>
  </section>

  <section id="screen-swipe" class="screen screen--dark">
    <div class="screen__scroll">
      <div class="filters" id="swipe-filters"></div>
      <div class="swipe__head">
        <span class="swipe__counter" id="swipe-counter"></span>
        <span class="swipe__track"><i id="swipe-bar"></i></span>
      </div>
      <div id="swipe-card" class="swipe-slot"></div>
      <button class="skip" id="swipe-skip" type="button" aria-label="Пропустить">
        <svg class="ic ic--18"><use href="#icon-close"></use></svg>
      </button>
    </div>
  </section>

  <section id="screen-favorites" class="screen screen--light">
    <div class="screen__scroll">
      <div class="head">
        <button class="head__back" id="fav-back" type="button" aria-label="Назад">
          <svg class="ic ic--20"><use href="#icon-back"></use></svg>
        </button>
        <h1 class="head__title">Избранное</h1>
      </div>
      <div class="tabs">
        <button class="tab is-on" id="tab-liked" type="button">Пойду <b id="tab-liked-count">0</b></button>
        <button class="tab" id="tab-saved" type="button">Отложенные <b id="tab-saved-count">0</b></button>
      </div>
      <div id="fav-list" class="fav-list"></div>
    </div>
  </section>

  <section id="screen-detail" class="screen screen--light">
    <div class="screen__scroll" id="detail-body"></div>
  </section>

  <section id="screen-profile" class="screen screen--light">
    <div class="screen__scroll">
      <div class="head"><h1 class="head__title">Профиль</h1></div>
      <div class="pk-card">
        <img class="pk-card__art" src="assets/pushkin-card-3d.png" alt="">
        <span class="pk-card__label">Пушкинская карта</span>
        <span class="pk-card__sum" id="profile-balance">—</span>
        <span class="pk-card__note" id="profile-note"></span>
      </div>
      <div class="wallets" id="wallets"></div>
      <h2 class="section-title">Куплено</h2>
      <div id="bought-list" class="fav-list"></div>
    </div>
  </section>

  <div class="ask" id="ask" hidden>
    <div class="ask__box" role="dialog" aria-modal="true" aria-labelledby="ask-title">
      <h2 class="ask__title" id="ask-title">Ты купил билет?</h2>
      <p class="ask__event" id="ask-event"></p>
      <p class="ask__note" id="ask-note"></p>
      <div class="ask__row">
        <button class="btn btn--buy" id="ask-yes" type="button">Да, купил</button>
        <button class="btn btn--ghost" id="ask-no" type="button">Ещё нет</button>
      </div>
    </div>
  </div>

  <nav class="nav" id="bottom-nav">
    <button class="nav__item" data-nav="screen-feed" type="button">
      <svg class="ic ic--22"><use href="#icon-home"></use></svg><span>Подборка</span>
    </button>
    <button class="nav__item" data-nav="screen-favorites" type="button">
      <svg class="ic ic--22"><use href="#icon-bookmark"></use></svg><span>Избранное</span>
    </button>
    <button class="nav__item" data-nav="screen-profile" type="button">
      <svg class="ic ic--22"><use href="#icon-user"></use></svg><span>Профиль</span>
    </button>
  </nav>

</div>

<script src="format.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
